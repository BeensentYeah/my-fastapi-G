<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>League of Legends Item Finder</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <header>
        <div class="header-container">
            <div>
                <h1> League of Legends Items </h1>
                <p>Explore, Search, and View</p>
            </div>
            <img src="https://logos-world.net/wp-content/uploads/2023/02/LoL-Symbol.png" alt="LoL Logo" class="lol-logo-top-right">
        </div>
    </header>

    <main>


        <section class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="Search for an item..."
                oninput="debouncedSearch()"
            >

            <button onclick="searchItems()">
                Search
            </button>

            <button class="secondary" onclick="loadItems()">
                Show All
            </button>

        </section>


        <section>

            <h2>League of Legends Items</h2>

            <div id="itemList" class="item-list">

                Loading items...

            </div>

        </section>

    </main>


    <footer>

        <p>Faker what was that?!?!?!?!?</p>

    </footer>

    <div id="itemModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modalBody">
            </div>
        </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
