<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>League of Legends Item Finder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <header class="site-header">
        <div class="header-inner">
            <span class="crest" aria-hidden="true">
                <svg viewBox="0 0 40 44" width="34" height="38">
                    <polygon points="20,1 38,11 38,33 20,43 2,33 2,11" fill="none" stroke="currentColor" stroke-width="1.5"/>
                    <polygon points="20,9 31,15 31,29 20,35 9,29 9,15" fill="none" stroke="currentColor" stroke-width="1"/>
                    <circle cx="20" cy="22" r="3.5" fill="currentColor"/>
                </svg>
            </span>
            <div>
                <h1>Item Shop</h1>
                <p>Every item on the Rift — stats, cost, and what it actually does.</p>
            </div>
        </div>
    </header>

    <main>

        <section class="search">

            <div class="search-field">
                <svg class="search-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
                    <circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/>
                    <line x1="13.5" y1="13.5" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search for an item..."
                    autocomplete="off"
                    oninput="debouncedSearch()"
                >
                <button type="button" class="clear-btn" id="clearBtn" onclick="clearSearch()" aria-label="Clear search" hidden>&times;</button>
            </div>

            <button onclick="searchItems()">
                Search
            </button>

            <button class="secondary" onclick="loadItems()">
                Show All
            </button>

        </section>

        <nav class="filters" id="categoryFilters" aria-label="Filter by category"></nav>

        <section>

            <div class="results-bar">
                <h2>League of Legends Items</h2>
                <span class="results-count" id="resultsCount"></span>
            </div>

            <div id="itemList" class="item-list">

                <p class="state-msg">Loading items...</p>

            </div>

        </section>

    </main>


    <footer>

        <p>Faker what was that?!?!?!?!?</p>

    </footer>

    <div id="itemModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
            <div id="modalBody">
            </div>
        </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
