<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>League of Legends Item Finder</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <header>

        <h1>⚔️ League of Legends Item Finder</h1>

        <p>Every single Item in the game</p>

    </header>


    <main>


        <section class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="Search for an item..."
                oninput="debouncedSearch()"
            >

            <button onclick="searchItems()">
                Search
            </button>

            <button class="secondary" onclick="loadItems()">
                Show All
            </button>

        </section>


        <section>

            <h2>League of Legends Items</h2>

            <div id="itemList" class="item-list">

                Loading items...

            </div>

        </section>

    </main>


    <footer>

        <p>Faker what was that?!?!?!?!?</p>

    </footer>

<!-- MODAL CONTAINER -->
    <div id="itemModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modalBody">
                <!-- Modal details will be inserted here -->
            </div>
        </div>
    </div>

    <!-- SCRIPT (Keep only one copy at the very end) -->
    <script src="app.js"></script>

</body>
</html>
